name: Local batch QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  journal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        node: ['22']
        include:
          - os: ubuntu-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --test --test-concurrency=1 local-batch/jobs/journal.test.mjs local-batch/jobs/guardian.test.mjs local-batch/jobs/workflow-snapshot.test.mjs local-batch/jobs/controller.test.mjs local-batch/jobs/contention.test.mjs local-batch/jobs/config.test.mjs local-batch/jobs/artifact-cleanup.test.mjs local-batch/jobs/queue-clock.test.mjs scripts/ci-test-counts.test.mjs
  batch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        node: ['22']
        include:
          - os: ubuntu-latest
            node: '20'
          - os: ubuntu-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node scripts/verify-package.mjs
      - name: Run mock and real browser tests through Bash bootstrap
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/bootstrap-local-batch.sh
      - name: Run mock and real browser tests through PowerShell bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap-local-batch.ps1
        env:
          PLAYWRIGHT_BATCH_TEST_FRESH_FIREFOX_RUNS: '10'
