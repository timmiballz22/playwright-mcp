name: Local batch QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  journal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        node: ['22']
        include:
          - os: ubuntu-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Run durable component tests
        id: components
        shell: bash
        run: node --test --test-concurrency=1 local-batch/jobs/journal.test.mjs local-batch/jobs/guardian.test.mjs local-batch/jobs/workflow-snapshot.test.mjs local-batch/jobs/controller.test.mjs local-batch/jobs/contention.test.mjs local-batch/jobs/config.test.mjs local-batch/jobs/private-windows.test.mjs local-batch/jobs/artifact-cleanup.test.mjs local-batch/jobs/queue-clock.test.mjs scripts/ci-test-counts.test.mjs 2>&1 | tee component-tests.log
      - name: Preserve failed component evidence
        if: failure() && steps.components.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journal-tests-${{ matrix.os }}-node${{ matrix.node }}
          path: component-tests.log
          retention-days: 1
          if-no-files-found: error
  batch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        node: ['22']
        include:
          - os: ubuntu-latest
            node: '20'
          - os: ubuntu-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify installed production package
        id: installed
        shell: bash
        run: node scripts/verify-package.mjs 2>&1 | tee installed-tests.log
      - name: Run mock and real browser tests through Bash bootstrap
        id: batch_bash
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/bootstrap-local-batch.sh 2>&1 | tee batch-tests.log
      - name: Run mock and real browser tests through PowerShell bootstrap
        id: batch_windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap-local-batch.ps1 2>&1 | Tee-Object -FilePath batch-tests.log
        env:
          PLAYWRIGHT_BATCH_TEST_FRESH_FIREFOX_RUNS: '10'
      - name: Preserve failed browser evidence
        if: failure() && (steps.installed.outcome == 'failure' || steps.batch_bash.outcome == 'failure' || steps.batch_windows.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: batch-tests-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            installed-tests.log
            batch-tests.log
          retention-days: 1
          if-no-files-found: error
