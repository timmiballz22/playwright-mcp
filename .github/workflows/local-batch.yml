name: Local batch QA
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run mock and real browser tests
        env:
          RUN_BROWSER_TESTS: '1'
        run: node --test local-batch/*.test.mjs
